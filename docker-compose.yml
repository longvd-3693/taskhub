services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskhub-app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: taskhub-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: taskhub
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: taskhub
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: taskhub-redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data: